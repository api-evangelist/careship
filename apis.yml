aid: careship
name: Careship
description: 'Careship (operated by Care Companion GmbH, Berlin) is a German senior-care
  marketplace that connects elderly people and their families with vetted, non-medical
  everyday helpers ("Alltagshilfen") from their own neighborhoods. The platform covers
  companionship, shopping, household support, mobility and leisure, light personal
  care, and dementia support, and helps families finance care through statutory long-term
  care insurance (Pflegekasse). Careship operates across 20+ German cities including
  Berlin, Hamburg, Munich, Cologne, Frankfurt, Stuttgart, and Dresden. It was added
  to the API Evangelist network as a portfolio company of Creandum; it is a consumer
  care-services business with no public developer or API surface at this time.'
